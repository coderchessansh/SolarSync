<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
<title id="title">SolarSync physical prototype</title>
<desc id="desc">Illustrated recreation of the SolarSync model: solar panel on a stand, 18650 battery, TP4056 controller, MT3608 boost converter and USB-connected phone.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d35"/><stop offset="1" stop-color="#071d19"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9e4d7"/></linearGradient>
  <linearGradient id="battery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b58aa"/><stop offset="1" stop-color="#472d62"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#063c28" flood-opacity=".18"/></filter>
</defs>
<rect width="760" height="920" rx="36" fill="#f5faf7"/>
<ellipse cx="375" cy="840" rx="310" ry="35" fill="#dce9e1"/>
<!-- solar panel -->
<g filter="url(#shadow)" transform="rotate(-3 375 175)">
  <rect x="105" y="85" width="540" height="185" rx="12" fill="#101b19" stroke="#dbe8e1" stroke-width="10"/>
  <rect x="122" y="101" width="506" height="153" rx="5" fill="url(#panel)"/>
  <g stroke="#5f8e7b" stroke-opacity=".6" stroke-width="3">
    <path d="M206 101v153M291 101v153M376 101v153M461 101v153M546 101v153"/>
    <path d="M122 151h506M122 202h506"/>
  </g>
  <circle cx="563" cy="129" r="4" fill="#8ed6b1"/>
</g>
<!-- stand -->
<path d="M346 270h58v370h-58z" fill="#e8e4da" stroke="#c7c1b4" stroke-width="3"/>
<path d="M318 600h114v35H318z" fill="#ddd7ca" stroke="#c1b9aa" stroke-width="3"/>
<path d="M286 625h178v210H286z" fill="url(#base)" stroke="#b9ae9d" stroke-width="5"/>
<!-- battery holder -->
<g filter="url(#shadow)" transform="rotate(-8 350 710)">
  <rect x="325" y="625" width="78" height="178" rx="35" fill="#1c1c22"/>
  <rect x="334" y="634" width="60" height="160" rx="28" fill="url(#battery)"/>
  <circle cx="364" cy="650" r="7" fill="#222"/>
  <path d="M364 795v18" stroke="#161616" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- TP4056 -->
<g filter="url(#shadow)">
  <rect x="395" y="620" width="145" height="65" rx="9" fill="#075c36"/>
  <rect x="404" y="628" width="127" height="49" rx="5" fill="#167d55"/>
  <circle cx="425" cy="653" r="7" fill="#f6c945"/><circle cx="444" cy="653" r="7" fill="#8ce8b2"/>
  <rect x="464" y="640" width="42" height="25" rx="3" fill="#1b2e2a"/>
  <text x="470" y="657" font-family="Arial,sans-serif" font-size="12" fill="white" font-weight="700">TP4056</text>
</g>
<!-- MT3608 -->
<g filter="url(#shadow)">
  <rect x="392" y="720" width="150" height="78" rx="10" fill="#0d5b78"/>
  <rect x="404" y="731" width="126" height="55" rx="6" fill="#126f91"/>
  <circle cx="425" cy="758" r="12" fill="#d7e5e9"/><circle cx="425" cy="758" r="6" fill="#444"/>
  <rect x="454" y="741" width="58" height="30" rx="4" fill="#e8eff0"/>
  <text x="458" y="760" font-family="Arial,sans-serif" font-size="12" fill="#0d536e" font-weight="700">MT3608</text>
</g>
<!-- phone -->
<g filter="url(#shadow)">
  <rect x="535" y="545" width="150" height="285" rx="24" fill="#111"/>
  <rect x="545" y="565" width="130" height="235" rx="12" fill="#050807"/>
  <rect x="576" y="675" width="70" height="25" rx="5" fill="#63df93"/>
  <rect x="575" y="674" width="72" height="26" rx="6" fill="none" stroke="#b8f2cc" stroke-width="3"/>
  <text x="585" y="720" font-family="Arial,sans-serif" font-size="14" fill="#d5e2db">75% charging</text>
</g>
<!-- wiring -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M350 265C350 380 370 490 420 620" stroke="#c73535" stroke-width="6"/>
  <path d="M385 265C385 390 410 500 445 620" stroke="#222" stroke-width="6"/>
  <path d="M397 685C430 700 450 710 465 720" stroke="#c73535" stroke-width="6"/>
  <path d="M430 690C450 705 475 716 500 720" stroke="#222" stroke-width="6"/>
  <path d="M542 760C570 770 600 780 620 800" stroke="#111" stroke-width="8"/>
</g>
<!-- USB -->
<rect x="500" y="790" width="55" height="30" rx="5" fill="#222"/>
<rect x="550" y="795" width="38" height="20" rx="3" fill="#d4d8d6"/>
<!-- labels -->
<g font-family="Arial,sans-serif" font-weight="700">
  <rect x="24" y="34" width="190" height="42" rx="21" fill="#075c36"/><text x="49" y="61" font-size="16" fill="white">SOLARSYNC PROTOTYPE</text>
  <text x="122" y="307" font-size="14" fill="#075c36">6V / 3W SOLAR PANEL</text>
  <text x="420" y="610" font-size="13" fill="#617168">TP4056 CHARGE CONTROL</text>
  <text x="430" y="815" font-size="13" fill="#617168">MT3608 → 5V USB</text>
</g>
</svg>
